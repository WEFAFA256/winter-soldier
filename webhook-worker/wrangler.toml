name = "serenity-pawapay-webhook"
main = "worker.js"
compatibility_date = "2026-11-20"

# Stable PawaPay callback URL:
#   https://serenity-pawapay-webhook.turyatembajohn905.workers.dev
# All four PawaPay callback boxes point here. Never change that in the dashboard.

[[kv_namespaces]]
binding = "SERENITY_PAWAPAY_EVENTS"
id = "1b4dfdce62c040bbbeee9ae1ab8c37fc"

[[d1_databases]]
binding = "SERENITY_DB"
database_name = "serenity-spa"
database_id = "e347be07-91a9-486c-b03a-415c42b906c3"

[vars]
PAWAPAY_API_BASE_URL = "https://api.pawapay.io"
PAWAPAY_COUNTRY = "UGA"
PAWAPAY_CURRENCY = "UGX"
# OPTIONAL: raw callbacks are also forwarded here if the app gains its own handler.
FORWARD_TO = ""
# OPTIONAL: linked from the post-payment return page.
SITE_URL = "https://www.executiveserenityspa.com"
# Set to e.g. 30 to charge a 30% deposit instead of the full service price.
# 100 (or unset) charges the full price. Values are rounded up to the next 1,000 UGX.
PAWAPAY_DEPOSIT_PERCENT = "100"
